x-spark-common: &spark-common
  build:
    context: .
    dockerfile: docker/spark/Dockerfile
  image: aq-spark:3.5.3
  environment: &spark-env
    SPARK_NO_DAEMONIZE: "true"
    # /opt/aq: code dự án; pyspark + py4j để chạy pytest/python3 trực tiếp (spark-submit tự thêm)
    PYTHONPATH: /opt/aq:/opt/spark/python:/opt/spark/python/lib/py4j-0.10.9.7-src.zip
    KAFKA_BOOTSTRAP: kafka:9092
    S3_ENDPOINT: http://minio:9000
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
    S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin123}
    PG_DSN: postgresql://${PG_USER:-aq_user}:${PG_PASSWORD:-aq_password}@postgres:5432/${PG_DB:-aq}
    PG_JDBC_URL: jdbc:postgresql://postgres:5432/${PG_DB:-aq}
    PG_USER: ${PG_USER:-aq_user}
    PG_PASSWORD: ${PG_PASSWORD:-aq_password}
    NYC_BBOX: ${NYC_BBOX:--74.26,40.49,-73.70,40.92}
  volumes:
    - .:/opt/aq

services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT cho các container trong mạng compose, PLAINTEXT_HOST cho máy host (test, chạy tay)
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  kafka-init:
    image: apache/kafka:3.7.0
    container_name: kafka-init
    depends_on:
      - kafka
    command: >
      bash -c "
        KT=/opt/kafka/bin/kafka-topics.sh; BS=kafka:9092
        until $$KT --bootstrap-server $$BS --list >/dev/null 2>&1; do echo 'Waiting for Kafka...'; sleep 2; done
        $$KT --create --if-not-exists --bootstrap-server $$BS --replication-factor 1 --partitions 6 --topic aq.openaq.measurements.v1 --config cleanup.policy=delete --config retention.ms=604800000
        $$KT --create --if-not-exists --bootstrap-server $$BS --replication-factor 1 --partitions 1 --topic aq.openaq.sensors.v1 --config cleanup.policy=compact --config retention.ms=-1
        $$KT --create --if-not-exists --bootstrap-server $$BS --replication-factor 1 --partitions 1 --topic aq.openaq.measurements.v1.dlq --config cleanup.policy=delete --config retention.ms=2592000000
        $$KT --create --if-not-exists --bootstrap-server $$BS --replication-factor 1 --partitions 3 --topic aq.alerts.level-changed.v1 --config cleanup.policy=delete --config retention.ms=604800000
        echo 'Kafka topics created.'
      "

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.0.0
    container_name: kafka-ui
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka

  spark-master:
    <<: *spark-common
    container_name: spark-master
    command: /opt/spark/sbin/start-master.sh
    ports:
      - "7077:7077"
      - "8082:8080"
      - "4040:4040"
    environment:
      <<: *spark-env
      SPARK_MASTER_HOST: spark-master
      # Mỗi app mặc định tối đa 2/4 core để streaming và batch chạy song song được
      SPARK_MASTER_OPTS: "-Dspark.deploy.defaultCores=2"

  spark-worker-1:
    <<: *spark-common
    container_name: spark-worker-1
    command: /opt/spark/sbin/start-worker.sh spark://spark-master:7077
    depends_on:
      - spark-master
    environment:
      <<: *spark-env
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: "2"

  spark-worker-2:
    <<: *spark-common
    container_name: spark-worker-2
    command: /opt/spark/sbin/start-worker.sh spark://spark-master:7077
    depends_on:
      - spark-master
    environment:
      <<: *spark-env
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: "2"

  # Docker Hub/quay.io không còn phát hành image MinIO chính thức; dùng bản Bitnami lưu trữ (ghim phiên bản).
  # MINIO_DEFAULT_BUCKETS tạo sẵn bucket khi khởi động.
  minio:
    image: bitnamilegacy/minio:2024.6.13
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin123}
      MINIO_DEFAULT_BUCKETS: aq-lake,aq-checkpoints
      MINIO_CONSOLE_PORT_NUMBER: "9001"
    volumes:
      - minio-data:/bitnami/minio/data

  postgres:
    image: timescale/timescaledb-ha:pg16
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${PG_USER:-aq_user}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-aq_password}
      POSTGRES_DB: ${PG_DB:-aq}
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
      - pg-data:/home/postgres/pgdata

  poller:
    build:
      context: .
      dockerfile: services/poller/Dockerfile
    container_name: poller
    depends_on:
      - kafka-init
    restart: unless-stopped
    environment:
      OPENAQ_API_KEY: ${OPENAQ_API_KEY}
      KAFKA_BOOTSTRAP: kafka:9092
      POLL_INTERVAL_SEC: ${POLL_INTERVAL_SEC:-600}
      NYC_BBOX: ${NYC_BBOX:--74.26,40.49,-73.70,40.92}

  notifier:
    build:
      context: .
      dockerfile: services/notifier/Dockerfile
    container_name: notifier
    depends_on:
      - kafka-init
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}

volumes:
  minio-data:
  pg-data:
