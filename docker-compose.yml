services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka-init:
    image: apache/kafka:3.7.0
    container_name: kafka-init
    depends_on:
      - kafka
    command: >
      bash -c "
        echo 'Waiting for Kafka to be ready...'
        sleep 10
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --partitions 6 --replication-factor 1 --topic aq.openaq.measurements.v1
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --partitions 1 --replication-factor 1 --topic aq.openaq.sensors.v1 --config cleanup.policy=compact
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --partitions 1 --replication-factor 1 --topic aq.openaq.measurements.v1.dlq
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 --topic aq.alerts.level-changed.v1
        echo 'Kafka topics created.'
      "

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka

  spark-master:
    image: apache/spark:3.5.3-python3
    container_name: spark-master
    command: /opt/spark/sbin/start-master.sh
    ports:
      - "7077:7077"
      - "8082:8080"
    environment:
      - SPARK_MASTER_HOST=spark-master
      - SPARK_NO_DAEMONIZE=true
      - S3_ENDPOINT=http://localstack:4566
      - S3_ACCESS_KEY=test
      - S3_SECRET_KEY=test
      - PYTHONPATH=/opt/spark
    volumes:
      - ./jobs:/opt/spark/jobs
      - ./common:/opt/spark/common
      - ./config:/opt/spark/config
      - ./validation:/opt/spark/validation
      - ./reports:/opt/spark/reports

  spark-worker-1:
    image: apache/spark:3.5.3-python3
    container_name: spark-worker-1
    command: /opt/spark/sbin/start-worker.sh spark://spark-master:7077
    environment:
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - SPARK_NO_DAEMONIZE=true
      - S3_ENDPOINT=http://localstack:4566
      - S3_ACCESS_KEY=test
      - S3_SECRET_KEY=test
      - PYTHONPATH=/opt/spark
    depends_on:
      - spark-master
    volumes:
      - ./jobs:/opt/spark/jobs
      - ./common:/opt/spark/common
      - ./config:/opt/spark/config

  spark-worker-2:
    image: apache/spark:3.5.3-python3
    container_name: spark-worker-2
    command: /opt/spark/sbin/start-worker.sh spark://spark-master:7077
    environment:
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - SPARK_NO_DAEMONIZE=true
      - S3_ENDPOINT=http://localstack:4566
      - S3_ACCESS_KEY=test
      - S3_SECRET_KEY=test
      - PYTHONPATH=/opt/spark
    depends_on:
      - spark-master
    volumes:
      - ./jobs:/opt/spark/jobs
      - ./common:/opt/spark/common
      - ./config:/opt/spark/config

  localstack:
    image: localstack/localstack:2.3.0
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1

  s3-init:
    image: amazon/aws-cli:latest
    container_name: s3-init
    depends_on:
      - localstack
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for LocalStack S3...' &&
      sleep 8 &&
      aws s3 mb s3://aq-lake --endpoint-url http://localstack:4566 || true &&
      aws s3 mb s3://aq-checkpoints --endpoint-url http://localstack:4566 || true &&
      echo 'S3 buckets created.'
      "

  postgres:
    image: postgis/postgis:14-3.3
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${PG_USER:-aq_user}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-aq_password}
      POSTGRES_DB: ${PG_DB:-aq}
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql

  poller:
    build:
      context: .
      dockerfile: services/poller/Dockerfile
    container_name: poller
    depends_on:
      - kafka-init
    environment:
      OPENAQ_API_KEY: ${OPENAQ_API_KEY}
      KAFKA_BOOTSTRAP: kafka:9092
      POLL_INTERVAL_SEC: ${POLL_INTERVAL_SEC:-600}
      NYC_BBOX: ${NYC_BBOX}

  notifier:
    build:
      context: ./services/notifier
      dockerfile: Dockerfile
    container_name: notifier
    depends_on:
      - kafka-init
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    restart: unless-stopped